        /* Animation flottante avec rotation légère */
.app-header {
    background: linear-gradient(135deg, #7c5ce0 0%, #9370f0 100%);
    padding: 22px 70px;
    border-radius: 50px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(124, 92, 224, 0.4);
    width: 100%;
    max-width: 500px;
    animation: floatHeader 3s ease-in-out infinite;
    position: relative;
    overflow: hidden;
}

/* Animation de flottement */
@keyframes floatHeader {
    0%, 100% {
        transform: translateY(0px) rotate(0deg);
    }
    50% {
        transform: translateY(-10px) rotate(1deg);
    }
}

/* Effet de brillance qui traverse le header */
.app-header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(255, 255, 255, 0.3) 50%,
        transparent 70%
    );
    animation: shine 3s infinite;
}

@keyframes shine {
    0% {
        transform: translateX(-100%) translateY(-100%) rotate(45deg);
    }
    100% {
        transform: translateX(100%) translateY(100%) rotate(45deg);
    }
}

/* Animation du titre */
.app-title {
    font-size: 2.2em;
    font-weight: 700;
    color: white;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    animation: titleGlow 2s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    0% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3),
                     0 0 20px rgba(124, 92, 224, 0.5);
    }
    100% {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                     0 0 30px rgba(124, 92, 224, 0.8),
                     0 0 40px rgba(124, 92, 224, 0.6);
    }
}

/* Animation au survol */
.app-header:hover {
    animation: hoverPulse 0.6s ease-in-out;
    box-shadow: 0 12px 40px rgba(124, 92, 224, 0.6);
}

@keyframes hoverPulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
}

/* Animation d'apparition au chargement */
.app-header {
    animation: floatHeader 3s ease-in-out infinite, 
               fadeInDown 0.8s ease-out;
}

@keyframes fadeInDown {
    0% {
        opacity: 0;
        transform: translateY(-50px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

        .app-title {
            font-size: 2.2em;
            font-weight: 700;
            color: white;

            text-transform: uppercase;
            
        }

        /* Carte de connexion */
        .login-card {
            background: #00e5cc;
            border-radius: 35px;
            padding: 50px 45px;
            width: 100%;
            box-shadow: 0 15px 50px rgba(0, 229, 204, 0.3);
            
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            
        }

     

        .lock-icon {
            font-size: 2em;
        }

        .login-title {
            font-size: 2em;
            font-weight: 700;
            color: #0f0c1f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-size: 1.1em;
            font-weight: 600;
            color: #0f0c1f;
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            padding: 16px 22px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            background: white;
            color: #1a1430;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(124, 92, 224, 0.3);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: #9999aa;
        }

        /* Boutons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 35px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 25px;
            font-size: 1.05em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-login {
            background: #7c5ce0;
            color: white;
            box-shadow: 0 4px 15px rgba(124, 92, 224, 0.4);
        }

        .btn-login:hover {
            background: #8a6ceb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 92, 224, 0.5);
        }

        .btn-register {
            background: #5a4ac9;
            color: white;
            box-shadow: 0 4px 15px rgba(90, 74, 201, 0.4);
        }

        .btn-register:hover {
            background: #6858d4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(90, 74, 201, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Lien retour */
        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #00e5cc;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: #00f5dc;
            text-decoration: underline;
        }

        /* Message d'erreur/succès */
        .message {
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 0.95em;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(255, 70, 70, 0.2);
            color: #ff4646;
            border: 1px solid rgba(255, 70, 70, 0.4);
        }

        .message.success {
            background: rgba(70, 255, 140, 0.2);
            color: #46ff8c;
            border: 1px solid rgba(70, 255, 140, 0.4);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-header {
                padding: 18px 40px;
            }

            .app-title {
                font-size: 1.8em;
            }

            .login-card {
                padding: 40px 30px;
            }

            .login-title {
                font-size: 1.6em;
            }

            .form-label {
                font-size: 1em;
            }

            .btn {
                font-size: 1em;
                padding: 15px;
            }
        }

        @media (max-width: 400px) {
            .app-title {
                font-size: 1.5em;
            }

            .login-card {
                padding: 35px 25px;
            }

            .login-title {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- En-tête de l'application -->
        <div class="app-header">
            <h1 class="app-title">Ma To Do List</h1>
        </div>

        <!-- Carte de connexion -->
        <div class="login-card">
            <div class="login-header">
                <span class="lock-icon">🔓</span>
                <h2 class="login-title">Connexion</h2>
            </div>

            <!-- Message d'erreur/succès -->
            <div id="message" class="message"></div>

            <!-- Formulaire de connexion -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email :</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input"
                        placeholder="votre@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe :</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-login">
                        Se Connecter
                    </button>
                    <button type="button" class="btn btn-register" onclick="window.location.href='register.html'">
                        S'inscrire
                    </button>
                </div>
            </form>
        </div>

        <!-- Lien de retour -->
        <div class="back-link">
            <a href="index.html">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        // Gestion du formulaire de connexion
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            // Validation basique
            if (!email || !password) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            // Validation de l'email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Veuillez entrer une adresse email valide', 'error');
                return;
            }

            // Simulation de connexion (remplacer par votre logique backend)
            showMessage('Connexion en cours...', 'success');
            
            // Simuler un délai de connexion
            setTimeout(() => {
                console.log('Tentative de connexion:', { email, password });
                
                // Ici, vous devriez envoyer les données à votre backend
                // Exemple avec fetch:
                /*
                fetch('votre-api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = 'dashboard.html';
                    } else {
                        showMessage('Email ou mot de passe incorrect', 'error');
                    }
                })
                .catch(error => {
                    showMessage('Erreur de connexion. Réessayez plus tard.', 'error');
                });
                */
                
                // Pour la démo, on redirige simplement
                window.location.href = 'dashboard.html';
            }, 1500);
        });

        // Fonction pour afficher les messages
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            // Masquer le message après 4 secondes
            if (type === 'error') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 4000);
            }
        }

        // Animation des inputs au focus
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.form-label').style.color = '#0a0815';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.form-label').style.color = '#0f0c1f';
            });
        });

        // Gestion de la touche Entrée
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
