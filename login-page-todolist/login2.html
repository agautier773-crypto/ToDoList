<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma To Do List - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* Header avec couleur #7048E9 */
        .header-title {
            background: linear-gradient(135deg, #7048E9 0%, #8B5CF6 100%);
            padding: 30px 80px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(112, 72, 233, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        .header-title h1 {
            color: white;
            font-size: 2.5em;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        /* Card de connexion avec couleur #1AF3D9 */
        .login-card {
            background: linear-gradient(135deg, #1AF3D9 0%, #00D9C0 100%);
            padding: 50px 60px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(26, 243, 217, 0.3);
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .lock-icon {
            font-size: 2em;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .login-header h2 {
            color: #1a1a1a;
            font-size: 2em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            color: #1a1a1a;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            background: white;
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 35px;
            position: relative;
            z-index: 1;
        }

        button {
            padding: 18px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Bouton Se Connecter avec couleur #7EB5D8 */
        .btn-login {
            background: linear-gradient(135deg, #7EB5D8 0%, #6BA5CC 100%);
            color: white;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #6BA5CC 0%, #5A94BB 100%);
        }

        /* Bouton S'inscrire avec couleur #406DCF */
        .btn-register {
            background: linear-gradient(135deg, #406DCF 0%, #3A5FBA 100%);
            color: white;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #3A5FBA 0%, #3451A5 100%);
        }

        /* Palette de couleurs affichée */
        .color-palette {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-box {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .color-code {
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title h1 {
                font-size: 1.8em;
            }

            .header-title {
                padding: 25px 50px;
            }

            .login-card {
                padding: 40px 30px;
            }

            .login-header h2 {
                font-size: 1.5em;
            }

            .color-palette {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .header-title h1 {
                font-size: 1.5em;
            }

            .header-title {
                padding: 20px 30px;
            }

            button {
                font-size: 1em;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Titre principal -->
        <div class="header-title">
            <h1>MA TO DO LIST</h1>
        </div>

        <!-- Carte de connexion -->
        <div class="login-card">
            <div class="login-header">
                <span class="lock-icon">🔓</span>
                <h2>Connexion</h2>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="votre@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-login">Se Connecter</button>
                    <button type="button" class="btn-register">S'inscrire</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Affichage de la palette de couleurs -->
    <div class="color-palette">
        <div class="color-item">
            <div class="color-box" style="background: #7048E9;"></div>
            <span class="color-code">#7048E9</span>
        </div>
        <div class="color-item">
            <div class="color-box" style="background: #1AF3D9;"></div>
            <span class="color-code">#1AF3D9</span>
        </div>
        <div class="color-item">
            <div class="color-box" style="background: #7EB5D8;"></div>
            <span class="color-code">#7EB5D8</span>
        </div>
        <div class="color-item">
            <div class="color-box" style="background: #406DCF;"></div>
            <span class="color-code">#406DCF</span>
        </div>
    </div>

    <script>
        // Gestion du formulaire de connexion
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Ici vous enverriez les données à votre backend
            console.log('Tentative de connexion:', { email, password });
            alert('Connexion en cours...');
            
            // Rediriger vers la page principale de l'application
            // window.location.href = 'todo-app.html';
        });

        // Gestion du bouton d'inscription
        document.querySelector('.btn-register').addEventListener('click', function() {
            // Rediriger vers la page d'inscription
            alert('Redirection vers la page d\'inscription...');
            // window.location.href = 'register.html';
        });
    </script>
</body>
</html>
